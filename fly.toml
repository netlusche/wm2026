[app]
name = "wm2026-tippspiel"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/wm2026.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "wm2026_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

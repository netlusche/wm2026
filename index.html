<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WM 2026 Tippspiel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=4" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <meta name="theme-color" content="#1E6EAF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tipp WM26" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://yourdomain.de/wm2026/" />
  <meta property="og:title"       content="WM 2026 Tippspiel" />
  <meta property="og:description" content="Tippe die Spiele der FIFA Weltmeisterschaft 2026. USA · Kanada · Mexiko." />
  <meta property="og:image"       content="https://yourdomain.de/wm2026/icons/icon-512.png" />
  <meta property="og:locale"      content="de_DE" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card"        content="summary" />
  <meta name="twitter:title"       content="WM 2026 Tippspiel" />
  <meta name="twitter:description" content="Tippe die Spiele der FIFA Weltmeisterschaft 2026. USA · Kanada · Mexiko." />
  <meta name="twitter:image"       content="https://yourdomain.de/wm2026/icons/icon-512.png" />
</head>
<body>

  <!-- Player selection modal -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-badge">⚽</div>
      <h2>WM 2026 Tippspiel</h2>
      <p>Wer tippt heute?</p>
      <div class="modal-buttons">
        <button class="btn-player" onclick="selectPlayer('david')">
          <span class="player-icon">🟦</span> David
        </button>
        <button class="btn-player" onclick="selectPlayer('frank')">
          <span class="player-icon">🟥</span> Frank
        </button>
        <button class="btn-admin" onclick="selectPlayer('admin')">
          🔑 Admin
        </button>
      </div>
    </div>
  </div>

  <!-- Admin password modal -->
  <div id="admin-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>Admin-Zugang</h2>
      <input type="password" id="admin-pw-input" placeholder="Passwort" class="admin-pw-input" />
      <div class="modal-buttons">
        <button class="btn-player" onclick="submitAdminPassword()">Einloggen</button>
        <button class="btn-admin" onclick="cancelAdmin()">Abbrechen</button>
      </div>
      <p id="admin-pw-error" class="error-text hidden">Falsches Passwort</p>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="header-logo">
        <span class="trophy">🏆</span>
        <div>
          <div class="header-title">WM 2026 Tippspiel</div>
          <div class="header-sub">USA · Kanada · Mexiko</div>
        </div>
      </div>
      <div class="header-right">
        <div id="score-badge" class="score-badge hidden">
          <span class="score-david">D: <strong id="score-david">0</strong></span>
          <span class="score-sep">|</span>
          <span class="score-frank">F: <strong id="score-frank">0</strong></span>
        </div>
        <button id="player-badge" class="player-badge" onclick="showModal()"></button>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="main-nav">
    <button class="nav-btn active" onclick="showSection('spieltage')" id="nav-spieltage">Spieltage</button>
    <button class="nav-btn" onclick="showSection('gruppen')" id="nav-gruppen">Gruppen</button>
    <button class="nav-btn" onclick="showSection('rangliste')" id="nav-rangliste">Rangliste</button>
    <button class="nav-btn" onclick="showSection('regeln')" id="nav-regeln">Spielregeln</button>
  </nav>

  <!-- Main content -->
  <main>

    <!-- ── Spieltage ── -->
    <section id="section-spieltage" class="section active">
      <div class="spieltag-scroll-wrap" id="spieltag-scroll-wrap">
        <div class="spieltag-scroll" id="spieltag-tabs"></div>
      </div>
      <div id="spieltag-content" class="match-grid"></div>
    </section>

    <!-- ── Gruppen ── -->
    <section id="section-gruppen" class="section hidden">
      <div id="gruppen-content" class="gruppen-grid"></div>
    </section>

    <!-- ── Rangliste ── -->
    <section id="section-rangliste" class="section hidden">
      <div id="rangliste-content"></div>
    </section>

    <!-- ── Spielregeln ── -->
    <section id="section-regeln" class="section hidden">
      <div id="regeln-content"></div>
    </section>

  </main>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <div class="orb-mid"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
